# Environment for the VEGA baseline.
#
# VEGA is installed from upstream at a pinned commit. On PyPI the package is
# `scvega`, NOT `vega` -- `pip install vega` fetches an unrelated project.
#
# The pins are hard: VEGA imports scvi-tools 0.9 APIs that later releases
# removed, and scvi-tools 0.9 constrains Python to 3.8. This is why the
# baselines cannot share GONNECT's environment (Python >=3.12).
#
# pytorch-lightning is deliberately absent -- scvi-tools 0.9 pulls a compatible
# version itself, and pinning it separately conflicts.
#
#     conda env create -f vega.yml

name: gonnect-vega

channels:
  - conda-forge

dependencies:
  - python=3.8
  - anndata=0.7.5
  - h5py=3.11.0
  - matplotlib=3.7.3
  - numba=0.58.1
  - scipy=1.10.1
  - statsmodels=0.14.1
  - umap-learn=0.5.6
  - pip
  - pip:
      - numpy==1.22.0
      - pandas==1.5.3
      - scikit-learn==0.23.1
      - scikit-misc==0.1.4
      - scanpy==1.9.3
      - seaborn==0.10.1
      - adjusttext==0.7.3
      - pyro-ppl==1.8.6
      - scvi-tools==0.9.0
      - torch==1.13.1
      - torchmetrics==0.2.0
      - setuptools<=59.5.0
      - git+https://github.com/LucasESBS/vega@146c6c8
